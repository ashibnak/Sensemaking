:root{
  --yellow:#F5B335;--yellow-soft:#F8D27A;--yellow-ul:#FCF1D8;
  --black:#0D0D0D;--char:#333333;--steel:#6B6B6B;--tert:#9A9A9A;
  --light:#E6E6E6;--sub:#EFEFEF;--bg:#FAFAFA;--surface:#FFFFFF;
  --font:'Vazirmatn','Tahoma','Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--char);direction:rtl;-webkit-font-smoothing:antialiased;line-height:1.7}
button,input,textarea,select{font-family:var(--font)}
a{color:inherit}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--black);padding:4vh}
.login-card{background:var(--surface);width:100%;max-width:420px;border-radius:6px;padding:34px 30px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.login-card .brand{font-weight:700;letter-spacing:.14em;font-size:.8rem;color:var(--black)}
.login-card .brand small{display:block;color:var(--steel);letter-spacing:0;font-weight:400;margin-top:2px}
.login-card .rule{height:4px;background:var(--yellow);margin:12px 0 18px;border-radius:2px}
.login-card h1{font-size:1.5rem;color:var(--black);margin-bottom:4px}
.login-card p.sub{color:var(--steel);font-size:.9rem;margin-bottom:20px}
label{display:block;font-size:.82rem;font-weight:700;color:var(--char);margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--light);border-radius:4px;padding:10px 12px;font-size:.95rem;background:#fff;color:var(--char)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);outline-offset:1px;border-color:var(--yellow)}
input.ltr{direction:ltr;text-align:right;letter-spacing:.06em}
.btn{display:inline-block;border:none;border-radius:4px;padding:11px 18px;font-size:.95rem;font-weight:700;cursor:pointer;background:var(--yellow);color:var(--black)}
.btn:hover{background:#E3A01C}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%;margin-top:20px}
.btn.ghost{background:transparent;border:1px solid var(--char);color:var(--char)}
.btn.ghost:hover{background:var(--light)}
.btn.sm{padding:7px 12px;font-size:.85rem}
.btn.xs{padding:4px 9px;font-size:.76rem;border-radius:3px}
.btn.danger{background:#C0392B;color:#fff}
.btn.danger:hover{background:#A93226}
.hint{font-size:.78rem;color:var(--tert);margin-top:14px;text-align:center}
.err{background:#FDECEA;border-right:4px solid #C0392B;color:#912018;font-size:.85rem;padding:9px 12px;border-radius:4px;margin-top:14px}

/* ---------- App shell ---------- */
#app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr;min-height:100vh;grid-template-areas:"top top" "side main"}
.topbar{grid-area:top;background:var(--black);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:60px}
.topbar .title{font-weight:700;font-size:1.02rem}
.topbar .title .accent{color:var(--yellow)}
.topbar .who{display:flex;align-items:center;gap:12px;font-size:.85rem;color:#ccc}
.chip{background:var(--yellow);color:var(--black);font-weight:700;font-size:.72rem;padding:3px 9px;border-radius:20px}
.chip.gray{background:#444;color:#eee}
.side{grid-area:side;background:var(--surface);border-left:1px solid var(--light);padding:16px 0}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 22px;font-size:.95rem;color:var(--char);cursor:pointer;border-right:3px solid transparent;text-decoration:none}
.nav a:hover{background:var(--sub)}
.nav a.active{border-right-color:var(--yellow);background:var(--yellow-ul);font-weight:700;color:var(--black)}
.nav .ico{width:22px;text-align:center;color:var(--steel)}
.nav a.active .ico{color:var(--yellow)}
.main{grid-area:main;padding:26px 32px;overflow:auto;max-height:calc(100vh - 60px)}

h2.page{font-size:1.7rem;color:var(--black);margin-bottom:4px}
p.pagesub{color:var(--steel);margin-bottom:22px}
h3.sec{margin:24px 0 12px;color:var(--black);font-size:1.08rem}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--surface);border:1px solid var(--light);border-radius:6px;padding:18px}
.card h3{font-size:1.1rem;color:var(--black);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card .meta{font-size:.8rem;color:var(--tert);margin-bottom:8px}
.card p{font-size:.9rem;color:var(--char)}
.badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--sub);color:var(--steel)}
.badge.done{background:#DFF0DE;color:#2c6e2c}
.badge.open{background:var(--yellow-ul);color:#8a6100}
.badge.soon{background:var(--sub);color:var(--tert)}
.weeknum{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;background:var(--black);color:var(--yellow);border-radius:50%;font-weight:700;font-size:.9rem;flex:none}
.kpi{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.kpi .k{background:var(--surface);border:1px solid var(--light);border-radius:6px;padding:14px 18px;min-width:130px}
.kpi .k b{display:block;font-size:1.6rem;color:var(--black)}
.kpi .k span{font-size:.8rem;color:var(--steel)}
.progress{height:8px;background:var(--sub);border-radius:5px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--yellow)}
.row-links a{display:inline-block;margin-left:8px}
hr.soft{border:none;border-top:1px solid var(--light);margin:16px 0}

/* entries / feed */
.entry{border:1px solid var(--light);border-radius:6px;padding:14px;margin-bottom:12px;background:#fff}
.entry .head{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--steel);margin-bottom:6px;flex-wrap:wrap}
.entry .head b{color:var(--black)}
.entry .body{font-size:.92rem;color:var(--char);white-space:pre-wrap}
.entry .file{display:inline-flex;align-items:center;gap:8px;background:var(--yellow-ul);border:1px solid var(--yellow-soft);border-radius:4px;padding:7px 11px;font-size:.85rem;margin-top:4px}
.comments{margin-top:10px;border-top:1px dashed var(--light);padding-top:8px}
.comment{font-size:.82rem;color:var(--char);padding:4px 0}
.comment b{color:var(--black)}
.addcomment{display:flex;gap:8px;margin-top:6px}
.addcomment input{flex:1;padding:7px 10px;font-size:.85rem}
.tag{font-size:.7rem;background:var(--black);color:#fff;padding:2px 8px;border-radius:20px}
.tag.team{background:var(--steel)}
.tag.file{background:var(--yellow);color:var(--black)}
.composer{background:var(--surface);border:1px dashed var(--steel);border-radius:6px;padding:16px;margin-bottom:18px}
.tabbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabbar button{padding:6px 14px;border:1px solid var(--light);background:#fff;border-radius:20px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--steel)}
.tabbar button.on{background:var(--black);color:#fff;border-color:var(--black)}
.empty{color:var(--tert);font-size:.9rem;padding:16px;text-align:center;border:1px dashed var(--light);border-radius:6px}
.notice{background:var(--yellow-ul);border-right:4px solid var(--yellow);border-radius:4px;padding:10px 14px;font-size:.85rem;color:#7a5600;margin-bottom:18px}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff;border:1px solid var(--light);border-radius:6px;overflow:hidden}
table.tbl th{background:var(--black);color:#fff;text-align:right;padding:9px 12px;font-weight:700}
table.tbl td{border-top:1px solid var(--light);padding:9px 12px;vertical-align:middle}
table.tbl td select,table.tbl td input{padding:5px 8px;font-size:.82rem}
table.tbl td .btn{margin-left:4px}

/* ---------- Workshop boards ---------- */
.wbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.wbar select{width:auto;min-width:150px;padding:7px 10px;font-size:.85rem}
.savestate{font-size:.78rem;color:var(--tert);margin-right:auto}
.savestate.on{color:#2c6e2c;font-weight:700}
.ro{background:#F1F1F1;border-right:4px solid var(--steel);color:var(--steel);font-size:.82rem;padding:8px 12px;border-radius:4px;margin-bottom:12px}

.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:start}
.col{background:#fff;border:1px solid var(--light);border-radius:6px;display:flex;flex-direction:column;min-height:220px}
.col>.h{padding:9px 12px;font-weight:700;font-size:.9rem;border-bottom:1px solid var(--light);display:flex;justify-content:space-between;align-items:center}
.col.obs>.h{background:var(--yellow-ul);color:#8a6100}
.col.int>.h{background:#EAF1F8;color:#2b5478}
.col.pool>.h{background:var(--sub);color:var(--char)}
.col>.body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.col>.body.over{background:var(--yellow-ul);outline:2px dashed var(--yellow)}
.scard{background:#fff;border:1px solid var(--light);border-right:3px solid var(--steel);border-radius:4px;padding:9px 11px;font-size:.86rem;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.col.obs .scard{border-right-color:var(--yellow)}
.col.int .scard{border-right-color:#4a7fb0}
.scard .ev{margin-top:6px;font-size:.76rem;color:var(--steel);background:var(--sub);border-radius:3px;padding:4px 7px}
.scard .acts{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.scard .acts button{border:1px solid var(--light);background:#fff;border-radius:3px;font-size:.72rem;padding:2px 7px;cursor:pointer;color:var(--steel)}
.scard .acts button:hover{background:var(--sub);color:var(--black)}
.unknowns{margin-top:16px;background:#fff;border:1px solid var(--light);border-radius:6px;padding:14px}
.unknowns b{font-size:.9rem;color:var(--black)}
.unknowns input{margin-top:8px;font-size:.86rem}

.imapgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.pane{background:#fff;border:1px solid var(--light);border-radius:6px}
.pane>.h{padding:9px 12px;font-weight:700;font-size:.9rem;border-bottom:1px solid var(--light);display:flex;justify-content:space-between;align-items:center;gap:8px}
.pane>.h small{font-weight:400;color:var(--tert);font-size:.76rem}
.pane>.body{padding:12px;display:flex;flex-direction:column;gap:12px}
.icard{border:1px solid var(--light);border-radius:5px;padding:11px}
.icard>textarea{font-size:.9rem;font-weight:700;color:var(--black);resize:vertical;min-height:52px}
.evrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ev label{font-size:.76rem;margin:0 0 5px}
.ev.for label{color:#2c6e2c}
.ev.ag label{color:#912018}
.ev.for{background:#F4FAF4;border-radius:4px;padding:8px}
.ev.ag{background:#FDF4F3;border-radius:4px;padding:8px}
.evitem{display:flex;gap:5px;align-items:flex-start;margin-bottom:5px}
.evitem textarea{font-size:.8rem;padding:6px 8px;resize:none;overflow:hidden}
.evitem .rm{border:none;background:none;color:var(--tert);cursor:pointer;font-size:.8rem;padding:4px}
.addev{border:1px dashed var(--light);background:#fff;border-radius:3px;font-size:.74rem;padding:3px 9px;cursor:pointer;color:var(--steel)}
.ifoot{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:.78rem;color:var(--steel);flex-wrap:wrap}
.lkbtn{border:1px solid var(--light);background:#fff;border-radius:20px;font-size:.74rem;padding:2px 11px;cursor:pointer;color:var(--steel)}
.lkbtn.on{background:var(--yellow);border-color:var(--yellow);color:var(--black);font-weight:700}
.srow{display:grid;grid-template-columns:1fr 1.6fr auto;gap:7px;align-items:center}
.srow input{font-size:.84rem;padding:7px 9px}
.xbtn{border:none;background:none;color:var(--tert);cursor:pointer;font-size:.85rem}
.addbtn{border:1px dashed var(--steel);background:#fff;border-radius:4px;font-size:.8rem;padding:5px 12px;cursor:pointer;color:var(--char);font-weight:700}

/* ---------- Pattern map ---------- */
.ice{display:flex;flex-direction:column;border:1px solid var(--light);border-radius:6px;overflow:hidden}
.icerow{display:grid;grid-template-columns:170px 1fr;align-items:stretch}
.icerow .h{padding:10px 12px;font-weight:700;font-size:.86rem;display:flex;flex-direction:column;justify-content:center;gap:3px}
.icerow .h small{font-weight:400;font-size:.72rem;line-height:1.55;opacity:.8}
.icerow textarea{border:none;border-radius:0;min-height:76px;font-size:.86rem;resize:vertical;background:transparent;border-right:1px solid rgba(0,0,0,.08)}
.icerow textarea:focus{outline-offset:-2px}
.icerow.d0{background:#fff}.icerow.d0 .h{background:#F3F3F3;color:var(--char)}
.icerow.d1{background:#F7FAFD}.icerow.d1 .h{background:#DCE7F4;color:#2B5478}
.icerow.d2{background:#EEF4FA}.icerow.d2 .h{background:#BFD3E9;color:#24476B}
.icerow.d3{background:var(--yellow-ul)}.icerow.d3 .h{background:var(--yellow);color:var(--black)}
.icewater{height:0;border-top:2px solid #2E5AAC;position:relative;z-index:2}
.icewater span{position:absolute;top:-10px;right:14px;background:#fff;color:#2E5AAC;font-size:.68rem;font-weight:700;letter-spacing:.08em;padding:0 7px}
.loop{border:1px solid var(--light);border-radius:6px;padding:12px;background:#fff;margin-bottom:12px}
.loop .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.loop .top input.lname{flex:1;min-width:180px;font-weight:700;font-size:.9rem}
.ltype{display:flex;gap:4px}
.ltype button{border:1px solid var(--light);background:#fff;border-radius:20px;font-size:.76rem;font-weight:700;padding:4px 12px;cursor:pointer;color:var(--steel)}
.ltype button.on{background:var(--black);color:#fff;border-color:var(--black)}
.ltype button.on.b{background:var(--steel);border-color:var(--steel)}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin-top:11px}
.stepbox{display:flex;align-items:center;gap:3px;background:var(--sub);border:1px solid var(--light);border-radius:4px;padding:4px 6px;max-width:230px}
.stepbox textarea{border:none;background:transparent;font-size:.8rem;padding:2px 4px;resize:none;overflow:hidden;min-width:120px;line-height:1.5}
.stepbox textarea:focus{outline:none}
.stepbox .rm{border:none;background:none;color:var(--tert);cursor:pointer;font-size:.72rem;padding:0 2px}
.steparw{align-self:center;color:var(--yellow);font-weight:700;font-size:1rem}
.loopback{align-self:center;font-size:.74rem;color:var(--steel);background:var(--yellow-ul);border-radius:20px;padding:3px 10px}
.loop .lfoot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.loop .lfoot label{margin:0 0 4px}
.loop .lfoot textarea{font-size:.82rem;min-height:52px;resize:vertical}
.lever{background:#fff;border:1px solid var(--yellow);border-right:4px solid var(--yellow);border-radius:6px;padding:14px;margin-top:14px}
.pfgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bx{background:#fff;border:1px solid var(--light);border-radius:6px;padding:11px 12px;display:flex;flex-direction:column}
.bx.wide{grid-column:1/-1;border-color:var(--yellow);border-right:4px solid var(--yellow);background:var(--yellow-ul)}
.bx .lab{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.bx .no{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;background:var(--black);color:var(--yellow);border-radius:50%;font-size:.7rem;font-weight:700;flex:none}
.bx .nm{font-weight:700;font-size:.87rem;color:var(--black)}
.bx .hint{font-size:.72rem;color:var(--tert);line-height:1.5}
.bx textarea{flex:1;min-height:78px;font-size:.85rem;resize:vertical}
.bx.wide textarea{min-height:66px;font-weight:700;background:#fff}
.line8{margin-top:12px;background:#fff;border:1px solid var(--steel);border-right:4px solid var(--steel);border-radius:6px;padding:12px 14px}
.line8 .lab{font-size:.87rem;font-weight:700;color:var(--black)}
.line8 textarea{margin-top:7px;font-size:.85rem;min-height:60px}
.pfcheck{margin-top:14px;background:var(--sub);border:1px solid var(--light);border-radius:6px;padding:12px 14px}
.pfcheck b{font-size:.87rem}
.pfcheck ul{margin:8px 0 0;padding-right:18px;font-size:.82rem;line-height:2;color:var(--char)}
.pfcheck li.bad{color:#9A3412}
/* ---- boards 5 (intervention portfolio) & 6 (executive recommendation) ---- */
.lprow{display:grid;grid-template-columns:auto 1fr 1.4fr auto auto auto;gap:6px;align-items:center;margin-bottom:7px}
.lprank{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;background:var(--sub);border:1px solid var(--light);border-radius:50%;font-size:.72rem;font-weight:700;color:var(--steel);flex:none}
.lprank.hi{background:var(--yellow);border-color:var(--yellow);color:var(--black)}
.lprow input,.lprow select{font-size:.82rem;padding:6px 8px}
.ipcard{border:1px solid var(--light);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ipcard.pick{border-color:var(--yellow);border-right:4px solid var(--yellow);background:var(--yellow-ul)}
.iphead{display:flex;align-items:center;gap:8px}
.iphead .no{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;background:var(--black);color:var(--yellow);border-radius:50%;font-size:.72rem;font-weight:700;flex:none}
.iphead .tt{font-weight:700;font-size:.9rem;padding:7px 9px}
.pickbox{display:flex;align-items:center;gap:5px;font-size:.76rem;color:var(--steel);white-space:nowrap}
.pickbox input{width:auto;margin:0}
.ipsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.exsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.exsel3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.ipsel label,.exsel label,.exsel3 label,.ipg2 label,.ipg3 label,.exfull{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--steel);font-weight:700}
.ipsel select,.exsel select,.exsel3 select{font-size:.8rem;padding:6px 8px}
.exsel3 input{font-size:.82rem;padding:6px 8px}
.hypbox{background:var(--sub);border:1px solid var(--light);border-radius:5px;padding:10px}
.hypbox>b{font-size:.78rem;color:var(--char)}
.hyp{display:grid;grid-template-columns:118px 1fr;gap:7px;align-items:start;margin-top:7px}
.hyp>span{font-size:.78rem;font-weight:700;color:var(--steel);padding-top:7px}
.hyp textarea{font-size:.82rem;resize:vertical}
.ipg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ipg3{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
.ipg2 input,.ipg3 input,.ipg2 textarea{font-size:.82rem}
.ipg2 label.kill textarea{border-color:var(--steel)}
.ipmx{width:100%;border-collapse:collapse;font-size:.82rem}
.ipmx th{font-size:.76rem;color:var(--steel);font-weight:700;padding:7px;text-align:center}
.ipmx th.r{text-align:start;width:26%}
.ipmx td{border:1px solid var(--light);height:44px;text-align:center;color:var(--tert)}
.ipmx td.hot{background:var(--yellow-ul);border-color:var(--yellow);color:var(--black);font-weight:700}
.exrow{border:1px solid var(--light);border-radius:5px;padding:10px;display:flex;flex-direction:column;gap:8px}
.exrow textarea,.exrow input{font-size:.82rem}
.exfull{margin-top:10px}
.extime{display:grid;grid-template-columns:112px 1fr;gap:9px;align-items:start;margin-bottom:9px}
.extime .tm{font-size:.76rem;font-weight:700;color:var(--steel);background:var(--sub);border-radius:4px;padding:6px 8px;text-align:center}
.extime b{font-size:.82rem;display:block;margin-bottom:4px}
@media(max-width:820px){
  .lprow{grid-template-columns:auto 1fr}
  .ipg2,.ipg3,.hyp,.extime{grid-template-columns:1fr}
}
.pfcheck li.good{color:#166534}
.lever b{font-size:.9rem;color:var(--black)}
.lever textarea{margin-top:8px;font-size:.88rem;min-height:70px}
@media(max-width:960px){.icerow{grid-template-columns:110px 1fr}.loop .lfoot{grid-template-columns:1fr}.pfgrid{grid-template-columns:1fr}}
@media(max-width:960px){.cols{grid-template-columns:1fr}.imapgrid{grid-template-columns:1fr}.evrow{grid-template-columns:1fr}}
@media(max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;grid-template-areas:"top" "side" "main"}
  .topbar{padding:0 12px;height:auto;min-height:54px;flex-wrap:wrap;gap:4px 10px}
  .topbar .title{font-size:.9rem}
  .topbar .who{font-size:.76rem;gap:8px}
  .topbar .who #tb-name{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side{padding:0;border-left:none;border-bottom:1px solid var(--light);position:sticky;top:0;z-index:30;background:var(--surface)}
  .nav{display:flex;overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{padding:11px 14px;white-space:nowrap;border-right:none;border-bottom:3px solid transparent;font-size:.88rem}
  .nav a.active{border-right-color:transparent;border-bottom-color:var(--yellow)}
  .main{padding:16px 14px;max-height:none;overflow:visible}
  .g3,.g2{grid-template-columns:1fr}
  .tabbar{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{white-space:nowrap}
}

/* ==================== helpers ==================== */
function esc(t){return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toFa(n){return String(n).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);}
function faToEn(s){return String(s||'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)));}
function fmt(ts){const d=new Date(ts);return d.toLocaleDateString('fa-IR')+' · '+d.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});}
function me(){return S.profile;}
function isInstructor(){return S.profile&&S.profile.role==='instructor';}
function teamName(id){const t=S.teams.find(t=>t.id===id);return t?t.name:'—';}
function uid(p){return (p||'x')+Date.now().toString(36)+Math.floor(Math.random()*9999).toString(36);}
function fileUrl(path){return sb.storage.from('submissions').getPublicUrl(path).data.publicUrl;}
function normPhone(raw){
  let s=faToEn(raw||'').replace(/[^0-9+]/g,'');
  if(s.indexOf('+98')===0) s='0'+s.slice(3);
  else if(s.indexOf('0098')===0) s='0'+s.slice(4);
  else if(s.indexOf('98')===0&&s.length===12) s='0'+s.slice(2);
  else if(s.indexOf('9')===0&&s.length===10) s='0'+s;
  if(/^0900\d{2}$/.test(s)) return s;   // workshop short-code logins 090001..090099
  return /^09\d{9}$/.test(s)?s:null;
}
const emailFor=p=>p+'@'+MAIL_DOMAIN;
function phoneOf(u){return u.phone||((u.email||'').split('@')[0])||'—';}

async function callAdmin(payload){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return {error:'وارد نشده‌اید.'};
  try{
    const r=await fetch(FN_ADMIN,{method:'POST',headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+session.access_token
    },body:JSON.stringify(payload)});
    return await r.json();
  }catch(e){return {error:'ارتباط با سرور برقرار نشد.'};}
}

function loginErr(msg){
  const e=document.getElementById('li-err');
  if(!msg){e.classList.add('hidden');return;}
  e.textContent=msg;e.classList.remove('hidden');
}
async function signIn(){
  loginErr('');
  const phone=normPhone(document.getElementById('li-phone').value);
  const pass=document.getElementById('li-pass').value||'';
  if(!phone){loginErr('شماره موبایل را درست وارد کنید (مثل ۰۹۱۲۱۲۳۴۵۶۷).');return;}
  if(!pass){loginErr('رمز عبور را وارد کنید.');return;}
  const btn=document.getElementById('li-btn');btn.disabled=true;btn.textContent='در حال ورود…';
  const {error}=await sb.auth.signInWithPassword({email:emailFor(phone),password:pass});
  btn.disabled=false;btn.textContent='ورود';
  if(error){
    loginErr(/Invalid login/i.test(error.message)?'شماره موبایل یا رمز درست نیست.':(/banned|disabled/i.test(error.message)?'این حساب غیرفعال شده است.':'ورود ناموفق: '+error.message));
    return;
  }
  await enterApp();
}

async function loadAll(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) return false;
  let {data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!prof){
    const m=user.user_metadata||{};
    prof={id:user.id,email:user.email,phone:m.phone||null,name:m.name||user.email,role:m.role||'member',team_id:m.team_id||null,active:true};
  }
  if(prof.active===false){await sb.auth.signOut();loginErr('این حساب غیرفعال شده است.');return false;}
  S.profile=prof;
  const res=await Promise.all([
    sb.from('teams').select('*').order('name'),
    sb.from('chapters').select('*').order('sort'),
    sb.from('entries').select('*').order('created_at',{ascending:false}),
    sb.from('comments').select('*').order('created_at'),
    sb.from('boards').select('*')
  ]);
  S.teams=res[0].data||[];S.chapters=res[1].data||[];S.boards=res[4].data||[];
  const cby={};(res[3].data||[]).forEach(c=>{(cby[c.entry_id]=cby[c.entry_id]||[]).push({author:c.author_name,body:c.body,ts:new Date(c.created_at).getTime()});});
  S.entries=(res[2].data||[]).map(r=>({id:r.id,chapter:r.chapter_id,type:r.type,author:r.author_name,team:r.team_name||'—',title:r.title,body:r.body,fileName:r.file_name,filePath:r.file_path,ts:new Date(r.created_at).getTime(),comments:cby[r.id]||[]}));
  if(!boardTeam) boardTeam=S.profile.team_id||(S.teams[0]&&S.teams[0].id)||null;
  return true;
}

function defSignal(){return {cards:FANAP.map(t=>({id:uid('c'),text:t,col:'pool',ev:''})),unknowns:['','','']};}
function mkI(t){return {id:uid('i'),text:t||'',forEv:[''],againstEv:[''],likely:''};}
function mkS(){return {id:uid('s'),who:'',reading:''};}
function defInterp(){return {signal:'',interps:[mkI(),mkI(),mkI()],stakes:[mkS(),mkS(),mkS()]};}
function normInterp(st){
  st=st||{};st.signal=st.signal||'';
  if(!Array.isArray(st.interps)||!st.interps.length)st.interps=[mkI(),mkI(),mkI()];
  if(!Array.isArray(st.stakes)||!st.stakes.length)st.stakes=[mkS(),mkS(),mkS()];
  st.interps.forEach(o=>{['forEv','againstEv'].forEach(f=>{
    if(typeof o[f]==='string')o[f]=o[f]?[o[f]]:[''];
    else if(!Array.isArray(o[f])||!o[f].length)o[f]=[''];});
    if(!o.id)o.id=uid('i');});
  st.stakes.forEach(o=>{if(!o.id)o.id=uid('s');});
  return st;
}
function normSignal(st){
  st=st||{};
  if(!Array.isArray(st.cards))st.cards=[];
  if(!Array.isArray(st.unknowns)||st.unknowns.length<3)st.unknowns=['','',''];
  st.cards.forEach(c=>{if(!c.id)c.id=uid('c');if(!c.col)c.col='pool';});
  return st;
}
function mkLoop(){return {id:uid('l'),name:'',type:'R',steps:['','',''],delay:'',ev:''};}
function defPattern(){return {ice:{event:'',pat:'',structure:'',model:''},loops:[mkLoop()],leverage:''};}
function normPattern(st){
  st=st||{};
  st.ice=st.ice||{};['event','pat','structure','model'].forEach(k=>{if(typeof st.ice[k]!=='string')st.ice[k]='';});
  if(!Array.isArray(st.loops)||!st.loops.length)st.loops=[mkLoop()];
  st.loops.forEach(o=>{
    if(!o.id)o.id=uid('l');
    if(o.type!=='B')o.type='R';
    if(typeof o.name!=='string')o.name='';
    if(typeof o.delay!=='string')o.delay='';
    if(typeof o.ev!=='string')o.ev='';
    if(!Array.isArray(o.steps)||o.steps.length<2)o.steps=['','',''];
  });
  if(typeof st.leverage!=='string')st.leverage='';
  return st;
}

  'بازکردن جریان اطلاعات','تغییر قاعده بازی','بازتعریف هدف و سنجه'];
const IP_LAYERS=['ساختار','فرآیند','معنا و رفتار'];
const IP_HZ=['۳۰ روز','۹۰ روز','۶ تا ۱۲ ماه'];

function mkLP(){return {id:uid('p'),txt:'',rung:4,lev:'متوسط',feas:'متوسط'};}
function mkCard(){return {id:uid('k'),title:'',lp:'',pat:'',layer:'',hz:'',

function normPortfolio(st){
  st=st||{};
  ['frame','loop','pitch','falsify'].forEach(k=>{if(typeof st[k]!=='string')st[k]='';});
  if(!Array.isArray(st.lps)||!st.lps.length)st.lps=[mkLP(),mkLP(),mkLP()];
  st.lps.forEach(o=>{
    if(!o.id)o.id=uid('p');
    if(typeof o.txt!=='string')o.txt='';
    o.rung=Math.min(7,Math.max(1,parseInt(o.rung,10)||4));
    if(IP_LEV.indexOf(o.lev)<0)o.lev='متوسط';
    if(IP_LEV.indexOf(o.feas)<0)o.feas='متوسط';
  });
  if(!Array.isArray(st.cards)||!st.cards.length)st.cards=[mkCard()];
  st.cards.forEach(o=>{
    if(!o.id)o.id=uid('k');
    ['title','lp','h1','h2','h3','h4','metric','base','test','stop','side','owner']
      .forEach(k=>{if(typeof o[k]!=='string')o[k]='';});

    if(IP_LAYERS.indexOf(o.layer)<0)o.layer='';

  return st;
}

 ['t2','قاب مسئله، و اینکه مسئله چه چیزی نیست','۱:۳۰ – ۳:۳۰'],
 ['t3','حلقه و شواهد','۳:۳۰ – ۶:۰۰'],

 ['t5','ریسک، بازنده، و آنچه نمی‌دانیم','۹:۰۰ – ۱۱:۰۰'],
 ['t6','درخواست و گام بعد','۱۱:۰۰ – ۱۲:۰۰']
];
const EX_SRC=['مصاحبه','نظرسنجی','داده عملکرد','مستندات','مشاهده میدانی','—'];
const EX_MODE=['هم‌گرایی','تکمیل','واگرایی'];

  'askWho','askBy','askWhat','inaction','horizon','unknown','kill']
  .concat(EX_PARTS.map(p=>p[0])).concat(EX_TMAP.map(t=>t[0]));
function mkEv(){return {id:uid('e'),claim:'',s1:'مصاحبه',s2:'—',mode:'هم‌گرایی',note:''};}
function mkLose(){return {id:uid('o'),who:'',loses:'',gains:'',obj:'هویت',answer:''};}
function defExec(){const o={askType:'تصمیم',evs:[mkEv(),mkEv()],loses:[mkLose()]};EX_KEYS.forEach(k=>o[k]='');return o;}
function normExec(st){
  st=st||{};
  EX_KEYS.forEach(k=>{if(typeof st[k]!=='string')st[k]='';});
  if(EX_ASKT.indexOf(st.askType)<0)st.askType='تصمیم';
  if(!Array.isArray(st.evs)||!st.evs.length)st.evs=[mkEv(),mkEv()];
  st.evs.forEach(o=>{
    if(!o.id)o.id=uid('e');
    ['claim','note'].forEach(k=>{if(typeof o[k]!=='string')o[k]='';});
    if(EX_SRC.indexOf(o.s1)<0)o.s1='مصاحبه';
    if(EX_SRC.indexOf(o.s2)<0)o.s2='—';
    if(EX_MODE.indexOf(o.mode)<0)o.mode='هم‌گرایی';
  });

function boardRow(kind,tid){return S.boards.find(b=>b.kind===kind&&b.team_id===tid);}
let loadedTeam=null;
const NORM={signal:normSignal,interp:normInterp,pattern:normPattern,frame:normFrame,
  portfolio:normPortfolio,exec:normExec};
const DEF={signal:defSignal,interp:defInterp,pattern:defPattern,frame:defFrame,
  portfolio:defPortfolio,exec:defExec};
function loadBoardsFor(tid,force){
  if(!force&&loadedTeam===tid&&KINDS.every(k=>BD[k]))return;
  KINDS.forEach(k=>{
    const r=boardRow(k,tid);
    BD[k]=NORM[k](r&&r.data?JSON.parse(JSON.stringify(r.data)):DEF[k]());
    BMETA[k]=r?{by:r.updated_by_name,at:r.updated_at}:null;
  });
  loadedTeam=tid;
}
function canEditBoard(){
  if(!boardTeam)return false;
  if(isInstructor())return true;
  return me().team_id===boardTeam;
}
let saveTimer=null,saving=false;
function setSaveState(txt,ok){
  const el=document.getElementById('savestate');
  if(el){el.textContent=txt;el.className='savestate'+(ok?' on':'');}
}
function touch(kind){
  if(!canEditBoard())return;
  setSaveState('در حال ذخیره…',false);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{saveTimer=null;persist(kind);},700);
}
async function persist(kind){
  if(!boardTeam||!canEditBoard())return;
  saving=true;
  const row={kind:kind,team_id:boardTeam,data:BD[kind],updated_at:new Date().toISOString(),updated_by:me().id,updated_by_name:me().name};
  const {data,error}=await sb.from('boards').upsert(row,{onConflict:'kind,team_id'}).select().maybeSingle();
  saving=false;
  if(error){setSaveState('ذخیره نشد: '+error.message,false);return;}
  const i=S.boards.findIndex(b=>b.kind===kind&&b.team_id===boardTeam);
  if(i>=0)S.boards[i]=data;else if(data)S.boards.push(data);
  BMETA[kind]={by:row.updated_by_name,at:row.updated_at};
  setSaveState('ذخیره شد ✓',true);
}
function subscribeBoards(tid){
  if(chan){sb.removeChannel(chan);chan=null;}
  chan=sb.channel('boards-'+tid)
    .on('postgres_changes',{event:'*',schema:'public',table:'boards',filter:'team_id=eq.'+tid},payload=>{
      const r=payload.new;if(!r||!r.kind)return;
      const i=S.boards.findIndex(b=>b.kind===r.kind&&b.team_id===r.team_id);
      if(i>=0)S.boards[i]=r;else S.boards.push(r);
      if(r.updated_by===me().id)return;
      if(r.team_id!==boardTeam)return;
      const nrm=NORM[r.kind];
      if(nrm)BD[r.kind]=nrm(JSON.parse(JSON.stringify(r.data)));
      BMETA[r.kind]={by:r.updated_by_name,at:r.updated_at};
      if(route!=='work')return;
      const ae=document.activeElement;
      if(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT')&&ae.closest('#workarea')){pendingRemote=true;setSaveState('ویرایش تازه از '+(r.updated_by_name||'هم‌تیمی')+' — پس از پایان تایپ اعمال می‌شود',false);return;}
      renderWork();
    }).subscribe();
}

function ipChecks(){
  const B=BD.portfolio,named=B.cards.filter(c=>c.title.trim()),any=named.length>0,cs=[];
  const add=(t,ok)=>cs.push([t,!!ok]);
  add('هر مداخله به یک نقطه اهرمی وصل است',any&&named.every(c=>c.lp));
  add('دست‌کم یک مداخله روی پله ۵ یا بالاتر',named.some(c=>{const l=B.lps.find(x=>x.id===c.lp);return l&&+l.rung>=5;}));
  add('فرضیه هر مداخله هر چهار تکه را دارد',any&&named.every(c=>c.h1.trim()&&c.h2.trim()&&c.h3.trim()&&c.h4.trim()));
  add('هر مداخله سنجه و خط پایه دارد',any&&named.every(c=>c.metric.trim()&&c.base.trim()));
  add('هر مداخله شرط ابطال دارد',any&&named.every(c=>c.stop.trim()));
  add('پیامد ناخواسته هر مداخله بررسی شده',any&&named.every(c=>c.side.trim()));
  add('هر مداخله مالک دارد',any&&named.every(c=>c.owner.trim()));
  add('پورتفولیو در هر سه لایه پخش است',IP_LAYERS.every(L=>named.some(c=>c.layer===L)));
  add('دست‌کم یک آزمونه با هزینه شکست کم',named.some(c=>c.cost==='کم'));

  const B=BD.exec,cs=[],f=k=>String(B[k]||'').trim();

  return '<div class="pfcheck"><b>آمادگی ارائه — '+toFa(score)+' از '+toFa(cs.length)+'</b><ul>'+

}

async function submitEntry(cid){
  const u=me();
  const title=(document.getElementById('cm-title').value||'').trim();
  const body=(document.getElementById('cm-body').value||'').trim();
  const mode=window._cmode||'text';
  if(!title){alert('یک عنوان بنویسید');return;}
  const btn=document.getElementById('cm-submit');if(btn){btn.disabled=true;btn.textContent='در حال ثبت…';}
  let file_path=null,file_name=null;
  try{
    if(mode==='file'){
      const f=document.getElementById('cm-file').files[0];
      if(!f){alert('یک فایل انتخاب کنید');if(btn){btn.disabled=false;btn.textContent='ثبت مشارکت';}return;}
      const path=cid+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');
      const up=await sb.storage.from('submissions').upload(path,f);
      if(up.error)throw up.error;
      file_path=path;file_name=f.name;
    }else if(!body){alert('متنی بنویسید');if(btn){btn.disabled=false;btn.textContent='ثبت مشارکت';}return;}
    const {error}=await sb.from('entries').insert({chapter_id:cid,author_id:u.id,author_name:u.name,
      team_id:u.team_id||null,team_name:u.team_id?teamName(u.team_id):'—',type:mode,title:title,body:body,file_path:file_path,file_name:file_name});
    if(error)throw error;
    await reload();
  }catch(e){alert('خطا در ثبت: '+(e.message||e));if(btn){btn.disabled=false;btn.textContent='ثبت مشارکت';}}
}
function entryHtml(e){
  const dl=e.filePath?'<a class="file" href="'+fileUrl(e.filePath)+'" target="_blank">⇪ '+esc(e.fileName)+'</a>':'';
  return '<div class="entry"><div class="head"><b>'+esc(e.title)+'</b>'+
    '<span class="tag '+(e.type==='file'?'file':'')+'">'+(e.type==='file'?'فایل':'متن')+'</span>'+
    '<span class="tag team">'+esc(e.team)+'</span>'+
    '<span>· '+esc(e.author)+' · '+fmt(e.ts)+'</span>'+
    (isInstructor()?'<button class="btn xs danger" style="margin-right:auto" onclick="delEntry(\''+e.id+'\')">حذف</button>':'')+'</div>'+
    (e.body?'<div class="body">'+esc(e.body)+'</div>':'')+dl+
    '<div class="comments">'+(e.comments||[]).map(c=>'<div class="comment"><b>'+esc(c.author)+':</b> '+esc(c.body)+'</div>').join('')+
      '<div class="addcomment"><input id="cmt-'+e.id+'" placeholder="نظر بدهید…" onkeydown="if(event.key===\'Enter\')addComment(\''+e.id+'\')"><button class="btn sm" onclick="addComment(\''+e.id+'\')">ارسال</button></div>'+
    '</div></div>';
}
async function addComment(eid){
  const u=me();const inp=document.getElementById('cmt-'+eid);const v=(inp.value||'').trim();if(!v)return;
  const {error}=await sb.from('comments').insert({entry_id:eid,author_id:u.id,author_name:u.name,body:v});
  if(error){alert('خطا: '+error.message);return;}
  await reload();
}
async function delEntry(id){
  if(!confirm('این مشارکت حذف شود؟'))return;
  await sb.from('comments').delete().eq('entry_id',id);
  const {error}=await sb.from('entries').delete().eq('id',id);
  if(error){alert('خطا: '+error.message);return;}
  await reload();
}
function vFeed(){
  const all=[].concat(S.entries).sort((a,b)=>b.ts-a.ts);
  return '<h2 class="page">کار دیگران</h2><p class="pagesub">جریان مشارکت همه اعضا و تیم‌ها؛ می‌توانید نظر بدهید.</p>'+
   (all.length?all.map(e=>{
     const ch=S.chapters.find(c=>c.id===e.chapter);
     return '<div style="margin-bottom:4px"><span class="badge open">فصل '+toFa(ch?ch.week:'؟')+' · '+esc(ch?ch.phase:'')+'</span></div>'+entryHtml(e);
   }).join(''):'<div class="empty">هنوز مشارکتی ثبت نشده.</div>');
}

/* ==================== admin ==================== */
function vManage(){
  const tab=window._mtab||'users';
  const tabs=[['users','کاربران'],['add','افزودن کاربر'],['teams','تیم‌ها'],['chapters','فصل‌ها'],['boards','تابلوهای تیم‌ها'],['entries','مشارکت‌ها']];
  let body='';
  if(tab==='users')body=mUsers();
  else if(tab==='add')body=mAdd();
  else if(tab==='teams')body=mTeams();
  else if(tab==='chapters')body=mChapters();
  else if(tab==='boards')body=mBoards();
  else body=mEntries();
  return '<h2 class="page">مدیریت دوره</h2><p class="pagesub">نمای مدرس: کاربران، تیم‌ها، فصل‌ها و خروجی کار تیم‌ها.</p>'+
   '<div class="tabbar">'+tabs.map(t=>'<button class="'+(tab===t[0]?'on':'')+'" onclick="mtab(\''+t[0]+'\')">'+t[1]+'</button>').join('')+'</div>'+body;
}
function mtab(t){window._mtab=t;render();if(t==='users')refreshUsers();}
async function refreshUsers(){
  const r=await callAdmin({action:'list'});
  if(r&&r.users){S.users=r.users;if(route==='manage'&&window._mtab==='users')render();}
  else if(r&&r.error){const el=document.getElementById('uerr');if(el)el.textContent='خطا: '+r.error;}
}
function teamOptions(sel){
  return '<option value="">— بدون تیم —</option>'+S.teams.map(t=>'<option value="'+t.id+'"'+(t.id===sel?' selected':'')+'>'+esc(t.name)+'</option>').join('');
}
function uname(id){const u=S.users.find(x=>x.id===id);return u?u.name:'';}
function mUsers(){
  const rows=S.users.map(u=>'<tr>'+
    '<td>'+esc(u.name)+'</td>'+
    '<td style="direction:ltr;text-align:right">'+esc(phoneOf(u))+'</td>'+
    '<td><select onchange="updUser(\''+u.id+'\',{team_id:this.value})">'+teamOptions(u.team_id)+'</select></td>'+
    '<td><select onchange="updUser(\''+u.id+'\',{role:this.value})">'+
      '<option value="member"'+(u.role==='member'?' selected':'')+'>عضو</option>'+
      '<option value="instructor"'+(u.role==='instructor'?' selected':'')+'>مدرس</option></select></td>'+
    '<td>'+(u.active===false?'<span class="badge">غیرفعال</span>':'<span class="badge done">فعال</span>')+'</td>'+
    '<td style="white-space:nowrap">'+
      '<button class="btn xs ghost" onclick="resetPass(\''+u.id+'\')">رمز تازه</button>'+
      '<button class="btn xs ghost" onclick="updUser(\''+u.id+'\',{active:'+(u.active===false?'true':'false')+'})">'+(u.active===false?'فعال کن':'غیرفعال')+'</button>'+
      (u.id===me().id?'':'<button class="btn xs danger" onclick="delUser(\''+u.id+'\')">حذف</button>')+
    '</td></tr>').join('');
  return '<div id="uerr" style="color:#912018;font-size:.85rem"></div>'+
   '<div class="notice">تغییر تیم و نقش بلافاصله ذخیره می‌شود. «رمز تازه» رمز جدیدی می‌سازد که باید به کاربر بدهید.</div>'+
   '<table class="tbl"><tr><th>نام</th><th>موبایل</th><th>تیم</th><th>نقش</th><th>وضعیت</th><th>عملیات</th></tr>'+
   (rows||'<tr><td colspan="6">در حال بارگذاری…</td></tr>')+'</table>';
}
async function updUser(id,patch){
  const r=await callAdmin(Object.assign({action:'update',id:id},patch));
  if(r.error){alert('خطا: '+r.error);return;}
  await refreshUsers();await loadAll();render();
}
async function resetPass(id){
  const p=prompt('رمز تازه برای '+uname(id)+' (حداقل ۶ کاراکتر):','');
  if(!p)return;
  const r=await callAdmin({action:'update',id:id,password:p});
  if(r.error){alert('خطا: '+r.error);return;}
  alert('رمز تغییر کرد. رمز تازه: '+p);
}
async function delUser(id){
  if(!confirm('حساب «'+uname(id)+'» کاملا حذف شود؟'))return;
  const r=await callAdmin({action:'delete',id:id});
  if(r.error){alert('خطا: '+r.error);return;}
  await refreshUsers();
}
function mAdd(){
  return '<div class="grid g2">'+
   '<div class="card"><h3>افزودن تکی</h3>'+
     '<label>شماره موبایل</label><input id="a-phone" class="ltr" placeholder="09121234567">'+
     '<label>نام و نام خانوادگی</label><input id="a-name" placeholder="نام کامل">'+
     '<label>تیم</label><select id="a-team">'+teamOptions(null)+'</select>'+
     '<label>نقش</label><select id="a-role"><option value="member">عضو (شرکت‌کننده)</option><option value="instructor">مدرس</option></select>'+
     '<label>رمز اولیه (خالی = شش رقم آخر موبایل)</label><input id="a-pass" class="ltr" placeholder="اختیاری">'+
     '<button class="btn block" onclick="addOne()">ساختن حساب</button></div>'+
   '<div class="card"><h3>افزودن گروهی</h3>'+
     '<p style="font-size:.85rem;color:var(--steel)">هر نفر در یک خط. ترتیب: موبایل، نام، تیم، رمز (سه مورد آخر اختیاری). جداکننده: ویرگول فارسی «،» یا انگلیسی یا تب.</p>'+
     '<textarea id="a-bulk" rows="9" style="margin-top:8px;font-size:.85rem" placeholder="09121234567، مریم رضایی، تیم الف&#10;09129876543، سعید کریمی، تیم ب&#10;09121112233، نگار احمدی"></textarea>'+
     '<button class="btn block" onclick="addBulk()">ساختن همه حساب‌ها</button></div>'+
   '</div><div id="a-result" style="margin-top:18px"></div>';
}
function parseBulk(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/[،,\t;]+/).map(x=>x.trim());
    const t=S.teams.find(t=>t.name===p[2]);
    return {phone:p[0],name:p[1]||'',team_id:t?t.id:null,team_label:p[2]||'',password:p[3]||''};
  });
}
async function addOne(){
  const phone=document.getElementById('a-phone').value;
  const person={phone:phone,name:document.getElementById('a-name').value,
    team_id:document.getElementById('a-team').value||null,
    role:document.getElementById('a-role').value,
    password:document.getElementById('a-pass').value};
  await doCreate([person]);
  document.getElementById('a-phone').value='';document.getElementById('a-name').value='';document.getElementById('a-pass').value='';
}
async function addBulk(){
  const people=parseBulk(document.getElementById('a-bulk').value||'');
  if(!people.length){alert('چیزی وارد نشده');return;}
  const unknown=people.filter(p=>p.team_label&&!p.team_id).map(p=>p.team_label);
  if(unknown.length&&!confirm('این تیم‌ها شناخته نشدند و نادیده گرفته می‌شوند: '+Array.from(new Set(unknown)).join('، ')+'\nادامه؟'))return;
  await doCreate(people);
}
async function doCreate(people){
  const box=document.getElementById('a-result');
  box.innerHTML='<div class="notice">در حال ساختن حساب‌ها…</div>';
  const r=await callAdmin({action:'create',people:people});
  if(r.error){box.innerHTML='<div class="err">خطا: '+esc(r.error)+'</div>';return;}
  const ok=r.results.filter(x=>x.ok),bad=r.results.filter(x=>!x.ok);
  box.innerHTML='<h3 class="sec">نتیجه</h3>'+
    (ok.length?'<div class="notice">این رمزها را به افراد بدهید؛ بعدا از همین‌جا قابل تغییرند.</div>'+
      '<table class="tbl"><tr><th>موبایل</th><th>رمز اولیه</th></tr>'+ok.map(x=>'<tr><td style="direction:ltr;text-align:right">'+esc(x.input)+'</td><td style="direction:ltr;text-align:right"><b>'+esc(x.password)+'</b></td></tr>').join('')+'</table>':'')+
    (bad.length?'<h3 class="sec">ناموفق</h3><table class="tbl"><tr><th>ورودی</th><th>دلیل</th></tr>'+bad.map(x=>'<tr><td>'+esc(x.input)+'</td><td>'+esc(x.error)+'</td></tr>').join('')+'</table>':'');
  await loadAll();await refreshUsers();
}
function mTeams(){
  return '<div class="card" style="max-width:520px"><h3>تیم تازه</h3>'+
    '<div style="display:flex;gap:8px;margin-top:8px"><input id="t-name" placeholder="نام تیم (مثلا: تیم د)">'+
    '<button class="btn sm" onclick="addTeam()">افزودن</button></div></div>'+
   '<h3 class="sec">تیم‌ها</h3><table class="tbl"><tr><th>تیم</th><th>اعضا</th><th>عملیات</th></tr>'+
   S.teams.map(t=>{
     const n=S.users.filter(u=>u.team_id===t.id).length;
     return '<tr><td>'+esc(t.name)+'</td><td>'+toFa(n)+'</td><td><button class="btn xs danger" onclick="delTeam(\''+t.id+'\')">حذف</button></td></tr>';
   }).join('')+'</table>';
}
async function addTeam(){
  const n=(document.getElementById('t-name').value||'').trim();
  if(!n)return;
  const r=await callAdmin({action:'team_create',name:n});
  if(r.error){alert('خطا: '+r.error);return;}
  await loadAll();render();
}
async function delTeam(id){
  const t=S.teams.find(x=>x.id===id);
  if(!confirm('تیم «'+(t?t.name:'')+'» حذف شود؟ تابلوهای این تیم هم پاک می‌شوند.'))return;
  const r=await callAdmin({action:'team_delete',id:id});
  if(r.error){alert('خطا: '+r.error);return;}
  if(boardTeam===id)boardTeam=null;
  await loadAll();render();
}
function mChapters(){
  return '<div class="notice">وضعیت هر فصل و نشانی فایل اسلاید را اینجا تنظیم کنید. «فعال» یعنی جلسه جاری.</div>'+
   '<table class="tbl"><tr><th>هفته</th><th>عنوان</th><th>وضعیت</th><th>فایل اسلاید</th></tr>'+
   S.chapters.map(c=>'<tr><td>'+toFa(c.week)+'</td><td>'+esc(c.title)+'</td>'+
     '<td><select onchange="updChapter(\''+c.id+'\',{status:this.value})">'+
       '<option value="soon"'+(c.status==='soon'?' selected':'')+'>به‌زودی</option>'+
       '<option value="open"'+(c.status==='open'?' selected':'')+'>فعال</option>'+
       '<option value="done"'+(c.status==='done'?' selected':'')+'>تکمیل</option></select></td>'+
     '<td><input value="'+esc(c.slides||'')+'" placeholder="WK03_Slides.html" onchange="updChapter(\''+c.id+'\',{slides:this.value})"></td></tr>').join('')+
   '</table>';
}
async function updChapter(id,patch){
  const {error}=await sb.from('chapters').update(patch).eq('id',id);
  if(error){alert('خطا: '+error.message);return;}
  await loadAll();render();
}
function mBoards(){
  const rows=S.teams.map(t=>{
    const rs=boardRow('signal',t.id),ri=boardRow('interp',t.id),rp=boardRow('pattern',t.id),rf=boardRow('frame',t.id),
          rq=boardRow('portfolio',t.id),rx=boardRow('exec',t.id);
    const sd=rs?normSignal(rs.data):null,idt=ri?normInterp(ri.data):null,pd=rp?normPattern(rp.data):null,fd=rf?normFrame(rf.data):null,
          qd=rq?normPortfolio(rq.data):null,xd=rx?normExec(rx.data):null;
    const qn=qd?qd.cards.filter(c=>c.title.trim()).length:0;
    const qp=qd?qd.cards.filter(c=>c.pick&&c.title.trim()).length:0;
    const xp=xd?EX_PARTS.filter(p=>String(xd[p[0]]||'').trim()).length:0;
    const xe=xd?xd.evs.filter(e=>e.claim.trim()).length:0;
    const obs=sd?sd.cards.filter(c=>c.col==='obs').length:0;
    const int=sd?sd.cards.filter(c=>c.col==='int').length:0;
    const unk=sd?sd.unknowns.filter(x=>x&&x.trim()).length:0;
    const ni=idt?idt.interps.filter(x=>x.text&&x.text.trim()).length:0;
    const ns=idt?idt.stakes.filter(x=>x.who&&x.who.trim()).length:0;
    return '<tr><td><b>'+esc(t.name)+'</b></td>'+
      '<td>'+toFa(obs)+' مشاهده / '+toFa(int)+' تفسیر / '+toFa(unk)+' مجهول</td>'+
      '<td>'+(idt&&idt.signal?esc(idt.signal.slice(0,45)):'—')+'</td>'+
      '<td>'+toFa(ni)+' تفسیر / '+toFa(ns)+' ذی‌نفع</td>'+
      '<td>'+(pd?(toFa(['event','pat','structure','model'].filter(k=>pd.ice[k].trim()).length)+' لایه / '+toFa(pd.loops.filter(l=>l.steps.filter(x=>x.trim()).length>=2).length)+' حلقه'+(pd.leverage.trim()?' / اهرم ✓':'')):'—')+'</td>'+
      '<td>'+(fd?(toFa(PF_FIELDS.filter(f=>fd[f[0]].trim()).length)+'/۷ خانه'+(fd.not.trim()?' / خط ۸ ✓':'')):'—')+'</td>'+
      '<td>'+(qd?(toFa(qn)+' مداخله'+(qp?' / '+toFa(qp)+' در سبد':'')):'—')+'</td>'+
      '<td>'+(xd?(toFa(xp)+'/۷ بخش'+(xe?' / '+toFa(xe)+' شاهد':'')):'—')+'</td>'+
      '<td style="font-size:.78rem;color:var(--tert)">'+lastEditor([rs,ri,rp,rf,rq,rx])+'</td>'+
      '<td><button class="btn xs" onclick="viewTeamBoard(\''+t.id+'\',\'signal\')">تابلو</button>'+
        '<button class="btn xs ghost" onclick="viewTeamBoard(\''+t.id+'\',\'interp\')">تفسیر</button>'+
        '<button class="btn xs ghost" onclick="viewTeamBoard(\''+t.id+'\',\'pattern\')">الگوها</button>'+
        '<button class="btn xs ghost" onclick="viewTeamBoard(\''+t.id+'\',\'frame\')">قاب</button>'+
        '<button class="btn xs ghost" onclick="viewTeamBoard(\''+t.id+'\',\'portfolio\')">پورتفولیو</button>'+
        '<button class="btn xs ghost" onclick="viewTeamBoard(\''+t.id+'\',\'exec\')">توصیه</button></td></tr>';
  }).join('');
  return '<div class="notice">خلاصه کار همه تیم‌ها. برای دیدن و ویرایش، روی دکمه‌های ستون آخر بزنید.</div>'+
   '<div style="overflow-x:auto"><table class="tbl"><tr><th>تیم</th><th>تابلوی نشانه‌ها</th><th>نشانه در حال تفسیر</th><th>نقشه تفسیر</th><th>نقشه الگوها</th><th>قاب مسئله</th><th>پورتفولیوی مداخله</th><th>توصیه اجرایی</th><th>آخرین ویرایش</th><th></th></tr>'+
   (rows||'<tr><td colspan="10">تیمی وجود ندارد.</td></tr>')+'</table></div>';
}
function lastEditor(rows){
  const r=rows.filter(Boolean).sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')))[0];
  return r?esc(r.updated_by_name||'—'):'—';
}
function viewTeamBoard(tid,kind){boardTeam=tid;boardKind=kind;loadBoardsFor(tid,true);subscribeBoards(tid);go('work');}
function mEntries(){
  const rows=S.entries.map(e=>{const ch=S.chapters.find(c=>c.id===e.chapter);
    return '<tr><td>'+esc(e.title)+'</td><td>'+esc(e.author)+'</td><td>'+esc(e.team)+'</td><td>فصل '+toFa(ch?ch.week:'؟')+'</td><td>'+(e.type==='file'?'فایل':'متن')+'</td><td>'+fmt(e.ts)+'</td></tr>';}).join('');
  return '<div class="kpi"><div class="k"><b>'+toFa(S.teams.length)+'</b><span>تیم</span></div>'+
    '<div class="k"><b>'+toFa(S.users.length)+'</b><span>کاربر</span></div>'+
    '<div class="k"><b>'+toFa(S.entries.length)+'</b><span>مشارکت</span></div></div>'+
   '<table class="tbl"><tr><th>عنوان</th><th>عضو</th><th>تیم</th><th>فصل</th><th>نوع</th><th>زمان</th></tr>'+
   (rows||'<tr><td colspan="6">—</td></tr>')+'</table>';
}

/* ==================== boot ==================== */
(async function(){
  const {data:{session}}=await sb.auth.getSession();
  if(session)await enterApp();
})();
</script>
